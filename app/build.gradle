plugins { id 'com.android.application' }

def keystoreFile = rootProject.file('tavo-release.keystore')

android {
    namespace 'app.tavo.rp'
    compileSdk 35

    defaultConfig {
        applicationId "app.tavo.rp"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "0.1.2"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('TAVO_STORE_PASSWORD') ?: 'tavo2026'
                keyAlias System.getenv('TAVO_KEY_ALIAS') ?: 'tavo'
                keyPassword System.getenv('TAVO_KEY_PASSWORD') ?: 'tavo2026'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
