plugins { id 'com.android.application' }

def keystoreFile = rootProject.file('qiyuan-release.keystore')

android {
    namespace 'app.qiyuan.rp'
    compileSdk 35

    defaultConfig {
        applicationId "app.qiyuan.rp"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "0.1.4"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('QIYUAN_STORE_PASSWORD') ?: 'qiyuan2026'
                keyAlias System.getenv('QIYUAN_KEY_ALIAS') ?: 'qiyuan'
                keyPassword System.getenv('QIYUAN_KEY_PASSWORD') ?: 'qiyuan2026'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
