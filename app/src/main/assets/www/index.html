<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e1114" />
<title>启源</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-stage">
    <div class="splash-mark">
      <img class="splash-logo" src="logo.png" alt="" draggable="false" />
      <i class="splash-sheen"></i>
    </div>
    <div class="splash-word">启源</div>
    <div class="splash-sub">沉浸式虚拟世界体验</div>
  </div>
</div>
<script>
window.__splashAt = performance.now();
window.__splashHide = function () {
  var el = document.getElementById('splash');
  if (!el || el.classList.contains('hide')) return;
  el.classList.add('hide');
  setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 620);
};
</script>
<div id="app" data-mode="message" data-bubble="flat" data-status="">
  <div class="bg" id="bg"></div>
  <div class="top-fade"></div>

  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnLeft" aria-label="世界状态">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="title" id="title">
      <span class="t1">启源</span>
      <span class="t2">沉浸式虚拟世界体验</span>
    </div>
    <button class="icon-btn" id="btnRight" aria-label="事件与配置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
    </button>
  </header>

  <main class="msg-list" id="msgList"></main>

  <button class="scroll-bottom" id="scrollBottom" aria-label="回到底部">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
  </button>

  <div class="composer" id="composer">
    <div class="quick-row" id="quickRow">
      <button data-quick="undo">↺ 撤回</button>
      <button data-quick="refresh">⟳ 刷新</button>
      <button data-quick="continue">→ 继续</button>
      <span class="quick-state" id="quickState">运转中</span>
    </div>
    <div class="composer-shell">
      <button class="cplus" id="btnPlus" aria-label="快捷操作">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="你要做什么？" autocomplete="off" spellcheck="false"></textarea>
      <button class="csend" id="btnSend" aria-label="发送">
        <span class="round" id="sendRound">
          <svg id="sendIcon" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </span>
      </button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>

  <aside class="drawer left" id="drawerLeft" aria-label="世界状态">
    <div class="dscroll" id="lScroll"></div>
  </aside>

  <aside class="drawer right" id="drawerRight" aria-label="事件簿与配置">
    <div class="dscroll" id="rScroll"></div>
  </aside>

  <div id="overlays"></div>
  <div class="toast" id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
